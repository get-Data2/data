# 과제 7 엣지 최적화 설정 — 대상 모델·실행 방식·측정 조건은 여기만 고친다.
# 형식: specs/007-edge-optimization/contracts/config.md (data-docs 저장소)
version: 1
models:                                   # 변환·측정 대상(묶음이 없으면 건너뛰고 '대기'로 표시)
  forecast_final: {source: var/forecast/bundle, kind: forecast}
  forecast_gru:   {source: forecast_b1, model: gru, kind: forecast}    # 과제 3 B1에서 최종과 같은 과거 길이
  forecast_lstm:  {source: forecast_b1, model: lstm, kind: forecast}
  forecast_tcn:   {source: forecast_b1, model: tcn, kind: forecast}
  ae_lab:         {source: var/anomaly/bundle, space: lab, kind: autoencoder}
  ae_office:      {source: var/anomaly/bundle, space: office, kind: autoencoder}
  ae_meeting:     {source: var/anomaly/bundle, space: meeting, kind: autoencoder}
  state:          {source: var/state/bundle, kind: classifier}

runners: [torch_cpu, torch_gpu, ort_cpu, ort_cuda, trt_fp16]   # 기준 = torch_cpu
optional_runners: [ort_trt, trt_int8, trt_fp32]                          # 동작할 때만
batches: [1, 3, 4]                       # 3 = 현재 공간 수, 4 = 확장 가정
onnx: {opset: 17}
trt:
  workspace_mb: 256
  profile: {min: 1, opt: 3, max: 4}
  fp32_last_layer: false                 # CO₂ 차이가 1ppm을 넘을 때만 켠다(research R4)
int8:
  calibration_samples: 2000              # 학습 기간 (공간, t0)에서만
  seed: 0
bench:
  warmup: 50
  repeat: 1000
  chunks: 3
  cpu_threads: [6, 1]                    # 보드 코어 6 / 공존 가정 1
  idle_s: 10
  contention_gr3d_pct: 5                 # 대기 GPU 사용률이 이보다 높으면 경합 표시·재측정
  max_retry: 3
  temp_limit_c: 80
  reproduce_p95_tol: 0.2
criteria:
  co2_max_ppm: 1.0
  class_flip_rate: 0.001
diff:
  samples: all                           # 과제 3 시험 표본 전체
colocate:
  llm_sizes_b: [1, 3, 7]
  llm_bits: 4
  llm_overhead_gb: 1.0                   # KV 캐시·런타임 여유 가정
  reserve_gb: {os: 1.5, collector: 0.2}
