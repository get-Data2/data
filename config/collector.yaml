# 수집기 설정 — 형식 변경·센서 추가·공간 변경은 이 파일만 고친다.
# 형식 설명: specs/001-data-collection/contracts/config.md (data-docs 저장소)
# 반영: systemctl --user reload wonil-collector  (검증 실패 시 기존 설정 유지)
version: 1

spaces:                      # 공간 매핑: id는 이후 과제의 토픽·API 경로에 쓰이므로 바꾸지 않는다
  - {id: lab,           name: 실습실,     kind: classroom, aliases: [실습실]}
  - {id: office,        name: 사무실,     kind: office,    aliases: [사무실]}
  - {id: office_out,    name: 사무실 밖,  kind: outdoor,   aliases: [사무실 밖]}
  - {id: ceo_room,      name: 대표실,     kind: office,    aliases: [대표실]}
  - {id: dev_room,      name: 개발실,     kind: office,    aliases: [개발실]}
  - {id: meeting,       name: 회의실,     kind: meeting,   aliases: [회의실]}
  - {id: focus_meeting, name: 집중회의실, kind: meeting,   aliases: [집중회의실]}
  - {id: plant,         name: 공용 설비,  kind: plant,     aliases: [controller]}
  - {id: storage,       name: 창고,       kind: storage,   aliases: [창고]}    # InfluxDB 과거 데이터에서 발견(EM300-TH 1대)

devices:                     # 장치 단위 덮어쓰기(태그가 틀리거나 비었을 때, 주기가 다를 때)
  24e124785c389818: {space: lab}          # 태그에 spot이 없는 장치 — 공간을 명시해 둔다
  dev001: {enabled: false}                # InfluxDB의 시험 행(location=lab, 2건)
  # 기대 보고 주기 — 2026-06-22~07-22 실측 간격 중앙값(과제 2 spec "기록 주기와 결측"). 나머지는 기본 60초
  24e124126d152590: {expected_period_s: 120}   # EM500-CO2 실습실 전방 좌측(122초)
  24e124126d152862: {expected_period_s: 120}   # EM500-CO2 실습실 후방 우측(122초)
  24e124128c140101: {expected_period_s: 600}   # AM107 실습실 전방 우측(600초)
  24e124725d089152: {expected_period_s: 600}   # AM103 회의실(600초)
  24e124136d151523: {expected_period_s: 600}   # EM300-TH 실습실 복도(2026-10-20~21 수집기 관측 10분)
  54427240-8598-11f1-bcac-bdfb397bbe8a: {expected_period_s: 120}   # xflow 개발실 실내기(간격 60초·120초 혼재, 2026-10-20~21 실측)
  c71aa2c0-859c-11f1-bcac-bdfb397bbe8a: {expected_period_s: 120}   # xflow 개발실 실외기(같음)
  # 사건형 센서(WS301 문 열림): 주기 보고가 아니라 열림·닫힘 때만 보낸다 → 커버율·결측 판정 제외
  24e124141d189196: {periodic: false}          # 사무실 출입문
  24e124141d229577: {periodic: false}          # 창고
  # 24e124xxxxxxxxxx: {expected_period_s: 600}
  # 24e124yyyyyyyyyy: {enabled: false}

items:                       # 표준 항목 이름: 단위 + 원천 필드 별칭
  co2:                {unit: ppm,  aliases: [co2]}
  temperature:        {unit: degC, aliases: [temperature, current_temperature]}
  humidity:           {unit: "%",  aliases: [humidity, current_humidity]}
  pressure:           {unit: hPa}
  tvoc:               {unit: ppb}
  battery:            {unit: "%"}
  power:              {unit: bool}
  target_temperature: {unit: degC}

sources:
  - name: chirpstack
    topic: application/+/device/+/event/up
    device_id: deviceInfo.devEui
    device_name: deviceInfo.deviceName
    model: deviceInfo.deviceProfileName
    space: deviceInfo.tags.location
    spot: deviceInfo.tags.spot
    measurements: object              # 이 사전의 숫자·참거짓 필드를 모두 측정값으로
    time: ["min(rxInfo[*].nsTime)"]     # 게이트웨이 시계(time)는 5분 빠를 수 있어 쓰지 않는다
    source_time: time
    frame_cnt: fCnt

  - name: xflow
    topic: xflow/hvacr/+/+/status
    also_topics: [xflow/controller/+/status]
    device_id: "topic[-2]"
    device_name: values.*.$key
    model: "topic[-3]"
    space: split(values.*.$key, "-", 0)
    measurements: values.*
    time: [ts]
    source_time: ts

ignore_topics:
  - gateway/+/state/#

timing:
  max_future_s: 120
  max_past_s: 3600

mqtt:    {keepalive_s: 30, reconnect_max_s: 30, stale_reconnect_s: 300, qos: 1, client_id: team2-jetson-collector-a1}
storage: {table_prefix: "", batch_rows: 1000, flush_interval_s: 2}
spool:   {path: var/spool.db, max_rows: 400000}
report:  {stale_after_s: 600, gap_min_minutes: 2, battery_warn_pct: 20}   # 배터리 이 값 이하면 ①표에 교체 경고

# InfluxDB 과거 데이터 적재(python -m collector backfill) — InfluxDB는 조회만 한다. 접속 정보는 .env
backfill:
  bucket: iot-bucket                     # .env INFLUX_BUCKET이 비어 있지 않으면 그쪽이 우선
  measurements: [co2, temperature, humidity, pressure, tvoc, battery, activity, illumination,
                 infrared, infrared_and_visible, LAeq, LAI, LAImax]
  chunk_hours: 24
  progress_path: var/backfill_progress.json
  batch_rows: 5000
