[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "team2-collector"
version = "0.1.0"
description = "MQTT 센서 수집기 (과제 1)"
requires-python = ">=3.12"
dependencies = [
  "paho-mqtt>=2.1",
  "PyMySQL>=1.1",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "amqtt==0.12.*"]
analysis = ["pandas>=3.0", "pyarrow>=26", "matplotlib>=3.11", "holidays>=0.107"]
# torch는 aarch64 CUDA판을 cu130 index에서 따로 설치한다(specs/003-forecast-60min/quickstart.md)
forecast = ["torch>=2.14"]
pretrained = ["chronos-forecasting==2.3.2"]
edgeopt = ["onnx>=1.23", "onnxruntime-gpu>=1.31", "tensorrt-cu13>=11.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
collector = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'unit or broker' -q"
markers = [
  "unit: 오프라인 단위 테스트",
  "broker: 보드 안 amqtt 시험 브로커 사용",
  "mysql: 실 MySQL(test_ 접두사 테이블) 사용",
  "live: 실 MQTT 브로커 사용",
  "forecast: 실데이터로 짧게 학습(과제 3, 느림)",
  "pretrained: 실제 사전학습 가중치 사용(과제 6, 느림)",
  "trt: 실제 TensorRT·GPU 필요(과제 7)",
]
